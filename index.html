<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Margate & Thanet United FC Archive</title>
  <base href="/football-archive/">
  <link rel="stylesheet" href="css/styles.css">

<style>
  .home-grid-equal {
    align-items: stretch;
  }

  .home-grid-equal > .content-box {
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.14);

    display: flex;
    flex-direction: column;
    padding: 22px;
    box-sizing: border-box;
    min-height: 100%;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  .home-grid-equal > .content-box h2 {
    margin-top: 0;
    min-height: 1.4em;
    display: flex;
    align-items: center;
  }

  .home-grid-equal #latestAdditions,
  .home-grid-equal #featuredPlayer {
    flex: 1;
  }

  .random-player-box {
    display: flex;
    flex-direction: column;
  }

  .random-player-footer {
    margin-top: auto;
    padding-top: 12px;
  }

  .featured-player-card {
    height: 100%;
  }

  .home-missing-section {
    width: 120%;
    max-width: 120%;
    margin-left: -10%;
  }

  .home-missing-filters {
    display: flex;
    gap: 18px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .home-missing-table {
    width: 100%;
    table-layout: auto;
  }

  .home-missing-table th,
  .home-missing-table td {
    vertical-align: middle;
    white-space: nowrap;
  }

  .home-missing-table th:nth-child(1),
  .home-missing-table td:nth-child(1),
  .home-missing-table th:nth-child(2),
  .home-missing-table td:nth-child(2) {
    width: 1%;
    white-space: nowrap;
  }

  .home-missing-table th:nth-child(5),
  .home-missing-table td:nth-child(5) {
    white-space: normal;
    text-align: left;
  }

  .home-missing-number {
    font-weight: normal;
    font-family: inherit;
    font-size: inherit;
    line-height: inherit;
  }

  .home-missing-result-link {
    display: grid;
    grid-template-columns: minmax(160px, 1fr) 70px minmax(160px, 1fr);
    align-items: center;
    column-gap: 12px;
    text-decoration: none;
    width: 100%;
  }

  .home-missing-result-team {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    white-space: nowrap;
  }

  .home-missing-result-home {
    justify-content: flex-end;
    text-align: right;
  }

  .home-missing-result-away {
    justify-content: flex-start;
    text-align: left;
  }

  .home-missing-result-score {
    text-align: center;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .home-missing-scorers {
    text-align: left !important;
  }

  @media (max-width: 900px) {
    .home-missing-section {
      width: 100%;
      max-width: 100%;
      margin-left: 0;
    }

    .home-missing-table th,
    .home-missing-table td {
      white-space: normal;
    }

    .home-missing-result-link {
      grid-template-columns: 1fr;
      row-gap: 4px;
    }

    .home-missing-result-home,
    .home-missing-result-away {
      justify-content: flex-start;
      text-align: left;
    }

    .home-missing-result-score {
      text-align: left;
    }
  }

</style>


<style>
  );

    const hideBtn = document.getElementById("hideMissingMatchesBtn");
    if (hideBtn) {
      hideBtn.addEventListener("click", () => {
        panel.style.display = "none";
        const showBtn = document.getElementById("showMissingMatchesBtn");
        if (showBtn) showBtn.style.display = "inline-block";
      });
    }
  }

  Promise.all([
    fetch("data/players.json").then(r => r.json()),
    fetch("data/matches.json").then(r => r.json()),
    fetch("data/appearances.json").then(r => r.json()),
    fetch("data/teams.json").then(r => r.json())
  ]).then(([players, matches, appearances, teams]) => {

    const playerApps = {};
    appearances.forEach(a => {
      playerApps[a.player_id] = (playerApps[a.player_id] || 0) + 1;
    });

    const playersComplete = players.filter(p => playerApps[p.id] > 0).length;
    const playersIncomplete = players.length - playersComplete;

    let compComplete = 0, compIncomplete = 0;
    let frComplete = 0, frIncomplete = 0;

    matches.filter(isIncludedInArchiveStats).forEach(match => {
      const complete = !isMatchIncomplete(match);
      const friendly = isFriendly(match);

      if (friendly) {
        if (complete) frComplete++;
        else frIncomplete++;
      } else {
        if (complete) compComplete++;
        else compIncomplete++;
      }
    });

    const allComplete = compComplete + frComplete;
    const allIncomplete = compIncomplete + frIncomplete;

    const playersPct = pct(playersComplete, players.length);
    const compPct = pct(compComplete, compComplete + compIncomplete);
    const frPct = pct(frComplete, frComplete + frIncomplete);
    const allPct = pct(allComplete, allComplete + allIncomplete);

    const table = document.getElementById("archiveStatsTable");

    table.innerHTML = `
      <tr>
        <td><strong>Complete</strong></td>
        <td>${playersComplete}</td>
        <td>${compComplete}</td>
        <td>${frComplete}</td>
        <td>${allComplete}</td>
      </tr>
      <tr>
        <td><strong>Incomplete</strong></td>
        <td>${playersIncomplete}</td>
        <td>${compIncomplete}</td>
        <td>${frIncomplete}</td>
        <td>${allIncomplete}</td>
      </tr>
      <tr class="${percentRowClass(allPct)}">
        <td><strong>% Complete</strong></td>
        <td>${playersPct}%</td>
        <td>${compPct}%</td>
        <td>${frPct}%</td>
        <td>${allPct}%</td>
      </tr>
    `;

    renderMissingMatches(matches, teams, appearances, players);

    const showBtn = document.getElementById("showMissingMatchesBtn");
    const panel = document.getElementById("homeMissingMatchesPanel");

    if (showBtn && panel) {
      showBtn.addEventListener("click", () => {
        panel.style.display = "block";
        showBtn.style.display = "none";
      });
    }
  }).catch(error => {
    const table = document.getElementById("archiveStatsTable");
    if (table) {
      table.innerHTML = `<tr><td colspan="5">Unable to load archive statistics.</td></tr>`;
    }
    console.error("Archive statistics error:", error);
  });
})();
</script>





  <script src="js/home.js"></script>
</body>
</html>
