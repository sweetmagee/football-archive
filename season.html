<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Season | Margate & Thanet United FC Archive</title>
  <base href="/football-archive/">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="header-bar">
    <h1>Margate &amp; Thanet United FC Archive</h1>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="archive.html">Archive</a>
    </div>
  </div>

  <div class="page-wrap">

    <h1 id="seasonTitle">Season</h1>

    <div class="content-box">
      <h2>Captains &amp; Managers</h2>
      <div id="seasonOfficials" class="season-grid">
        <div class="season-main">
          <h3>Captains</h3>
          <table class="archive-table">
            <thead>
              <tr>
                <th>Team</th>
                <th>Captain</th>
              </tr>
            </thead>
            <tbody id="seasonCaptainsTable"></tbody>
          </table>
        </div>

        <div class="season-side">
          <h3>Managers</h3>
          <table class="archive-table">
            <thead>
              <tr>
                <th>Team</th>
                <th>Manager</th>
              </tr>
            </thead>
            <tbody id="seasonManagersTable"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="season-grid">
      <div class="season-main">

        <div class="content-box">
          <h2>Matches</h2>
          <div id="matches" class="match-list"></div>
        </div>

        <div class="content-box">
          <h2>League Table</h2>
          <table class="archive-table">
            <thead>
              <tr>
                <th>Pos</th>
                <th>Team</th>
                <th>P</th>
                <th>W</th>
                <th>D</th>
                <th>L</th>
                <th>GF</th>
                <th>GA</th>
                <th>GD</th>
                <th>Pts</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>

      </div>

      <div class="season-side">
        <h2>Top Scorers</h2>
        <div id="scorers" class="scorer-list"></div>
      </div>
    </div>

  </div>

  <script src="js/season.js"></script>
</body>
</html>
