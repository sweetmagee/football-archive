<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Season | Margate & Thanet United FC Archive</title>
  <base href="/football-archive/">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="header-bar site-header-image">
    <div class="site-header-overlay">
      <h1>Margate &amp; Thanet United FC Archive</h1>

      <div class="nav-links">
  <a href="index.html">Home</a>
  <a href="players.html">Players</a>
  <a href="seasons.html">Seasons</a>
  <a href="managers.html">Managers</a>
  <a href="opponents.html">Opponents</a>
</div>
    </div>
  </div>

  <div class="page-wrap">

    <h1 id="seasonTitle">Season</h1>

   <div class="season-grid">
  <div class="season-main">
    <div class="content-box">
      <h2 id="managerHeading">Manager</h2>
      <table class="archive-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Span of Matches</th>
          </tr>
        </thead>
        <tbody id="seasonManagersTable"></tbody>
      </table>
    </div>
  </div>

  <div class="season-side">
    <div class="content-box">
      <h2>Player of the Season</h2>
      <div id="playerOfSeasonBox">Unknown</div>
    </div>
  </div>
</div>

    <div class="season-grid">
      <div class="season-main">

        <div class="content-box">
          <h2>Matches</h2>
          <div id="matches" class="match-list"></div>
        </div>

        <div class="content-box">
          <h2>League Table</h2>
          <table class="archive-table">
            <thead>
              <tr>
                <th>Pos</th>
                <th>Team</th>
                <th>P</th>
                <th>W</th>
                <th>D</th>
                <th>L</th>
                <th>GF</th>
                <th>GA</th>
                <th>GD</th>
                <th>Pts</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>

      </div>

      <div class="season-side">
        <h2>Top Scorers</h2>
        <div id="scorers" class="scorer-list"></div>
      </div>
    </div>

  </div>

  <script src="js/season.js"></script>
</body>
</html>
