<!-- Updated season.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Season | Margate & Thanet United FC Archive</title>
  <base href="/football-archive/">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="header-bar site-header-image">
  <div class="site-header-overlay">
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="players.html">Players</a>
      <a href="managers.html">Managers</a>
      <a href="seasons.html">Seasons</a>
      <a href="opponents.html">Opponents</a>
      <a href="statistics.html">Statistics</a>
      <a href="records.html">Records</a>
      <a href="honours.html">Honours</a>
      <a href="history.html">History</a>
      <a href="interactive.html">Interactive</a>
    </div>
  </div>
</div>

<div class="page-wrap">

<h1 id="seasonTitle">Season</h1>

<div class="content-box">
  <h2 id="managerHeading">Manager</h2>
  <table class="archive-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Span of Matches</th>
      </tr>
    </thead>
    <tbody id="seasonManagersTable"></tbody>
  </table>
</div>

<div class="content-box">
  <h2>Overall Record</h2>
  <table class="archive-table">
    <thead>
      <tr>
        <th>Record</th>
        <th>P</th>
        <th>W</th>
        <th>D</th>
        <th>L</th>
        <th>GF</th>
        <th>GA</th>
        <th>GD</th>
      </tr>
    </thead>
    <tbody id="overallRecordTable"></tbody>
  </table>
</div>

<div class="content-box">
  <h2>Season Statistics</h2>

  <div style="display:flex; gap:18px; flex-wrap:wrap; margin-bottom:12px;">
    <label class="stats-toggle">
      <input type="radio" name="seasonStatsFilter" value="competitive" checked>
      Competitive Games Only
    </label>

    <label class="stats-toggle">
      <input type="radio" name="seasonStatsFilter" value="friendly">
      Friendly Games Only
    </label>

    <label class="stats-toggle">
      <input type="radio" name="seasonStatsFilter" value="all">
      All Matches
    </label>
  </div>

  <h3>Appearances</h3>
  <div id="appearances" style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px;"></div>

  <h3 style="margin-top:18px;">Goalscorers</h3>
  <div id="scorers" style="display:grid;grid-template-columns:repeat(2,1fr);gap:18px;"></div>
</div>

<div class="content-box">
  <h2>Matches</h2>
  <div id="matches" class="match-list"></div>
</div>

<div class="content-box">
  <h2>League Table</h2>
  <table class="archive-table">
    <thead>
      <tr>
        <th>Pos</th>
        <th>Team</th>
        <th>P</th>
        <th>W</th>
        <th>D</th>
        <th>L</th>
        <th>GF</th>
        <th>GA</th>
        <th>GD</th>
        <th>Pts</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

</div>

<script src="js/season.js"></script>
</body>
</html>
