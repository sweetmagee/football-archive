<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Season | Margate & Thanet United FC Archive</title>
  <base href="/football-archive/">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="header-bar site-header-image">
  <div class="site-header-overlay">
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="players.html">Players</a>
      <a href="managers.html">Managers</a>
      <a href="seasons.html">Seasons</a>
      <a href="opponents.html">Opponents</a>
      <a href="statistics.html">Statistics</a>
      <a href="records.html">Records</a>
      <a href="honours.html">Honours</a>
      <a href="history.html">History</a>
      <a href="interactive.html">Interactive</a>
    </div>
  </div>
</div>

<div class="page-wrap">

  <h1 id="seasonTitle">Season</h1>

  <div class="content-box">
    <h2 id="managerHeading">Manager</h2>
    <div id="recordGameFilters" style="display:flex; gap:18px; align-items:center; flex-wrap:wrap; margin-bottom:12px;">
      <label class="stats-toggle">
        <input type="checkbox" id="recordAllGames" checked>
        All Games
      </label>

      <label class="stats-toggle">
        <input type="checkbox" id="recordHomeGamesOnly">
        Home Games Only
      </label>

      <label class="stats-toggle">
        <input type="checkbox" id="recordAwayGamesOnly">
        Away Games Only
      </label>
    </div>

    <table class="archive-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Span of Matches</th>
        </tr>
      </thead>
      <tbody id="seasonManagersTable"></tbody>
    </table>
  </div>

  <div class="content-box">
    <h2>Match Record</h2>
    <table class="archive-table">
      <thead>
        <tr>
          <th>Record</th>
          <th>P</th>
          <th>W</th>
          <th>D</th>
          <th>L</th>
          <th>GF</th>
          <th>GA</th>
          <th>GD</th>
        </tr>
      </thead>
      <tbody id="overallRecordTable"></tbody>
    </table>
  </div>

  <div class="content-box">
    <h2>Season Statistics</h2>

    <div style="display:flex; gap:18px; flex-wrap:wrap; align-items:center; margin-bottom:12px;">
      <label class="stats-toggle">
        <input type="radio" name="seasonStatsFilter" value="competitive" checked>
        Competitive Games Only
      </label>

      <label class="stats-toggle">
        <input type="radio" name="seasonStatsFilter" value="friendly">
        Friendly Games Only
      </label>

      <label class="stats-toggle">
        <input type="radio" name="seasonStatsFilter" value="all">
        All Matches
      </label>

      <label class="stats-toggle" style="margin-left:20px;">
        <input type="checkbox" id="appearancesOnly">
        Appearances Only
      </label>

      <label class="stats-toggle">
        <input type="checkbox" id="goalscorersOnly">
        Goalscorers Only
      </label>
    </div>

    <h3 id="seasonStatsHeading">Appearances &amp; Goalscorers <span id="seasonStatsPlayerCount"></span></h3>
    <div id="appearances" class="season-stats-columns"></div>
  </div>

  <div class="content-box season-matches-wide">
    <h2>Matches</h2>

    <div id="matchFilters" style="display:flex; gap:18px; align-items:center; flex-wrap:wrap; margin-bottom:12px;">
      <label class="stats-toggle">
        <input type="checkbox" id="allGamesMatches" checked>
        All Games
      </label>

      <label class="stats-toggle">
        <input type="checkbox" id="homeGamesOnlyMatches">
        Home Games Only
      </label>

      <label class="stats-toggle">
        <input type="checkbox" id="awayGamesOnlyMatches">
        Away Games Only
      </label>

      <label class="stats-toggle">
        <input type="checkbox" id="competitiveOnlyMatches">
        Competitive Games Only
      </label>

      <label class="stats-toggle">
        <input type="checkbox" id="friendlyOnlyMatches">
        Friendly Games Only
      </label>

      <label class="stats-toggle" id="excludeUnknownResultsLabel" style="display:none;">
        <input type="checkbox" id="excludeUnknownResults">
        Exclude Unknown Results
      </label>

      <label class="stats-toggle" id="excludeAbandonedGamesLabel" style="display:none;">
        <input type="checkbox" id="excludeAbandonedGames">
        Exclude Abandoned Games
      </label>
    </div>

    <div id="matches" class="match-list"></div>
  </div>

  <div class="content-box">
    <h2>League Table</h2>
    <table class="archive-table">
      <thead>
        <tr>
          <th>Pos</th>
          <th>Team</th>
          <th>P</th>
          <th>W</th>
          <th>D</th>
          <th>L</th>
          <th>GF</th>
          <th>GA</th>
          <th>GD</th>
          <th>Pts</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

</div>

<script src="js/season.js"></script>
</body>
</html>
